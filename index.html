<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b, #020617);
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
      max-width: 650px;
      animation: fadeIn 1.5s ease;
    }

    .icon {
      font-size: 70px;
      margin-bottom: 20px;
      animation: rotate 4s linear infinite;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 15px;
      color: #e2e8f0;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      padding: 10px 20px;
      border: 1px solid #38bdf8;
      border-radius: 30px;
      color: #38bdf8;
      font-size: 14px;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
    }

    .dots {
      margin-top: 30px;
      font-size: 30px;
      letter-spacing: 8px;
    }

    .dots span {
      animation: blink 1.4s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 rgba(56, 189, 248, 0);
      }
      50% {
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 0.2;
      }
      50% {
        opacity: 1;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      h2 {
        font-size: 20px;
      }

      p {
        font-size: 15px;
      }

      .icon {
        font-size: 55px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">⚙️</div>

    <h1>Something New Is Coming</h1>

    <h2>Website Under Maintenance</h2>

    <p>
      We're working behind the scenes to bring you something
      exciting, fresh and better than before.
      Stay tuned!
    </p>

    <div class="badge">
      🚀 COMING SOON
    </div>

    <div class="dots">
      <span>•</span>
      <span>•</span>
      <span>•</span>
    </div>

  </div>

</body>
</html>
